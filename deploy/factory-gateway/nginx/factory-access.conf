# This file is included inside the existing www.tjgtkj.cn server block.
# Protected surfaces include /ai-factory/, /api/, /runtime.html, /mobile.html,
# /styles.css, /brand-guangtai-white.png, and the deployed JavaScript modules.

location = /factory-access {
    proxy_pass http://127.0.0.1:5180/factory-access;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /factory-access/login {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:5180/factory-access/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /factory-access/logout {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:5180/factory-access/logout;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /_factory_auth_check {
    internal;
    proxy_pass http://127.0.0.1:5180/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location @factory_access_login {
    return 302 /factory-access;
}

location = /ai-factory {
    return 308 /ai-factory/;
}

location /ai-factory/ {
    auth_request /_factory_auth_check;
    error_page 401 = @factory_access_login;
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location /api/ {
    auth_request /_factory_auth_check;
    error_page 401 = @factory_access_login;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ~ ^/(?:runtime|mobile)\.html$ {
    auth_request /_factory_auth_check;
    error_page 401 = @factory_access_login;
    proxy_pass http://127.0.0.1:5173$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(?:styles\.css|brand-guangtai-white\.png)$ {
    auth_request /_factory_auth_check;
    error_page 401 = @factory_access_login;
    proxy_pass http://127.0.0.1:5173$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(?:access-control|action-execution|analysis-stream|api-client|app|blueprint-renderer|blueprint-store|build-plan|build-progress|build-stage-artifacts|build-visualizer|cognition-insights|dashboard-metrics|display-utils|duty-blueprint|expense-blueprint|expense-engine|expense-runtime|factory-idle|guided-session|interaction-feedback|mobile-page|operational-maturity|preview-builder|preview-navigation|product-guide|runtime-agent|runtime-domain|runtime-page|starter-blueprint)\.js$ {
    auth_request /_factory_auth_check;
    error_page 401 = @factory_access_login;
    proxy_pass http://127.0.0.1:5173$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
